# Custom headers when serving docs through Amplify Hosting
#
# See: https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html#setting-custom-headers
customHeaders:
  - pattern: '**/*'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Frame-Options'
        value: 'DENY'
      - key: 'X-XSS-Protection'
        value: '1; mode=block'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Content-Security-Policy'
        value: 'upgrade-insecure-requests;'
      # CSP also set in _document.tsx meta tag
      # Link headers advertise agent-discovery resources (RFC 8288 / RFC 9727):
      # the API catalog, the agent skills index, and the LLM-friendly docs index.
      - key: 'Link'
        value: '</.well-known/api-catalog>; rel="api-catalog", </.well-known/agent-skills/index.json>; rel="agent-skills"; type="application/json", </ai/llms.txt>; rel="service-doc"; type="text/plain"'
  # The API catalog has no file extension, so set its media type explicitly
  # (RFC 9727 / RFC 9264).
  - pattern: '.well-known/api-catalog'
    headers:
      - key: 'Content-Type'
        value: 'application/linkset+json'
